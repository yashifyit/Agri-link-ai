version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./kisanlink.db
      - SECRET_KEY=sih-kisanlink-2026-secret-key-maharashtra-production
      - JWT_SECRET=kisanlink-jwt-secure-access-key-2026
      - JWT_REFRESH_SECRET=kisanlink-jwt-secure-refresh-key-2026
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - RAZORPAY_KEY_ID=rzp_test_kisanlink2026
      - RAZORPAY_KEY_SECRET=rzp_secret_kisanlink2026demo
      - AI_API_KEY=83d2e1576f4daf060a5340405a775364
      - MANDI_API_URL=https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
